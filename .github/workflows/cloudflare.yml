name: Cloudflare

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/cloudflare.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CF_SEND_TELEMETRY: "false"
      # Secrets cannot be read inside an `if:` directly, so the presence of the
      # token is resolved here and checked below. Without it the workflow still
      # builds and checks the project, and skips only the upload.
      # The account id is optional: with a token scoped to one account, cf
      # resolves the account itself. Only the token gates the upload.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npx cf build

      - name: Check the deploy without uploading
        run: npx cf deploy --prebuilt --mode production --dry-run

      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request' && env.HAS_CF_TOKEN == 'true'
        run: |
          set -o pipefail
          # An empty account id must not look like a chosen account.
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx cf deploy --prebuilt --mode production 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the deployed site answers
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          code="$(curl -sS -o body.json -w '%{http_code}' \
            --retry 6 --retry-all-errors --retry-delay 5 "$URL/health")"
          echo "GET $URL/health -> HTTP $code"
          cat body.json; echo
          test "$code" = "200"
          echo "### Live at [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: No Cloudflare credentials, upload skipped
        if: github.event_name != 'pull_request' && env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::notice::Build and checks passed. Add the CLOUDFLARE_API_TOKEN repository secret to deploy."
